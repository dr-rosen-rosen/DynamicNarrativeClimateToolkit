# Glint Survey Domain Definitions

domains:
  ActMan:
    name: 'Accountability - Manager'
    items: 
      - 'My manager discussed the results of the last employee pulse survey with our team.'
  ActTake:
    name: 'Action Taking'
    items:  
      - 'I believe meaningful action will be taken as a result of this survey.'
  Auth:
    name: 'Authenticity'
    items:  
      - 'I am comfortable being myself at work.'
  Belong:
    name: 'Belonging'
    items:  
      - 'I feel a sense of belonging at this organization.'
  Care:
    name: 'Care'
    items:  
      - 'At work, I feel cared about as a person.'
  Career:
    name: 'Career'
    items:  
      - 'I have good career opportunities at Johns Hopkins.'
  CareerPath:
  name: 'Career Path'
  items: 'My manager has meaningful discussions with me about my career development.' 
